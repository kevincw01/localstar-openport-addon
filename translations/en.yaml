configuration:
  latitude:
    name: Latitude
    description: Your weather location's latitude, from -90 to 90.
  longitude:
    name: Longitude
    description: Your weather location's longitude, from -180 to 180.
  timezone:
    name: Timezone
    description: IANA timezone for the thermostat's local clock, for example Europe/London.
  certificate_file:
    name: Server certificate chain
    description: Path relative to /ssl, containing the server certificate followed by its matching root.
  private_key_file:
    name: Server private key
    description: Path relative to /ssl. Use the key matching the imported CA's server certificate.
  sync_time:
    name: Synchronize thermostat time
    description: Respond to time requests using the configured timezone.
  allow_old_tls:
    name: Allow legacy TLS
    description: Enable only if your firmware needs older TLS versions or ciphers.
network:
  9001/tcp: Skyport TLS entry listener
  41414/tcp: Skyport TLS session listener. Keep the host port set to 41414.
