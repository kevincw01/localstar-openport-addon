configuration:
  mqtt_enabled:
    name: Publish Home Assistant sensors
    description: Discover weather and Skyport diagnostics through MQTT. The server works without MQTT.
  mqtt_host:
    name: MQTT broker host (optional)
    description: Leave blank to use the Supervisor-provided MQTT service automatically.
  mqtt_port:
    name: MQTT port
    description: Used with an explicit broker host. Supervisor service settings include their own port.
  mqtt_username:
    name: MQTT username
    description: Used only with an explicit broker host.
  mqtt_password:
    name: MQTT password
    description: Used only with an explicit broker host. Never published to entities or logs.
  mqtt_tls:
    name: MQTT TLS
    description: Verify the broker certificate using public system roots. Used only with an explicit host.
  latitude:
    name: Latitude override (optional)
    description: Leave unset to use Home Assistant's home latitude. An override must be between -90 and 90.
  longitude:
    name: Longitude override (optional)
    description: Leave unset to use Home Assistant's home longitude. An override must be between -180 and 180.
  timezone:
    name: Timezone
    description: Select Home Assistant to inherit HA's timezone, or choose an IANA timezone override. Restart to apply location or timezone changes.
  certificate_file:
    name: External certificate chain (optional fallback)
    description: Path relative to /ssl, used only until credentials are generated or uploaded in Web UI.
  private_key_file:
    name: External private key (optional fallback)
    description: Path relative to /ssl, used only until a managed certificate pair is activated in Web UI.
  sync_time:
    name: Synchronize thermostat time
    description: Respond to time requests using the configured timezone.
  allow_old_tls:
    name: Allow legacy TLS
    description: Enable only if your firmware needs older TLS versions or ciphers.
network:
  9001/tcp: Skyport TLS entry listener
  41414/tcp: Skyport TLS session listener. Keep the host port set to 41414.
