name: Test server and add-on

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and TLS integration tests
        run: python -m unittest discover -s tests -v
      - name: Build add-on on native architecture
        run: docker build -t localstar-openport:test .
      - name: Container TLS, heartbeat and lifecycle tests
        run: python tests/smoke_addon.py --skip-weather
      - name: Certificate generation and upload through ingress
        run: python tests/smoke_certificates.py
