name: localstar-openport
version: "1.0.0"
slug: localstar_openport
description: Local Skyport weather and time server for Venstar ColorTouch thermostats
url: https://github.com/kevincw01/localstar-openport-addon
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: true
ports:
  9001/tcp: 9001
  41414/tcp: 41414
ports_description:
  9001/tcp: Skyport TLS entry listener
  41414/tcp: Skyport TLS session listener (keep host port 41414)
map:
  - type: ssl
    read_only: true
options:
  latitude: null
  longitude: null
  timezone: null
  certificate_file: localstar-openport/server-chain.pem
  private_key_file: localstar-openport/server.key
  sync_time: true
  allow_old_tls: false
schema:
  latitude: float(-90,90)
  longitude: float(-180,180)
  timezone: str
  certificate_file: str
  private_key_file: str
  sync_time: bool
  allow_old_tls: bool
